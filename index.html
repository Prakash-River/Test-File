<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Modifier - Insert "Tesla" Above "Car"</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      color: #fff;
    }

    p.subtitle {
      color: var(--text-muted);
      margin-top: 0.4rem;
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    /* Upload Dropzone */
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: var(--accent);
      background-color: rgba(56, 189, 248, 0.05);
    }

    .dropzone svg {
      width: 44px;
      height: 44px;
      fill: none;
      stroke: var(--accent);
      stroke-width: 1.8;
      margin-bottom: 0.75rem;
    }

    .dropzone p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .dropzone span {
      color: var(--accent);
      font-weight: 600;
    }

    input[type="file"] {
      display: none;
    }

    /* Options / Controls */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
    }

    .btn-group {
      display: flex;
      gap: 0.75rem;
    }

    button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0.6rem 1.25rem;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:active {
      transform: translateY(1px);
    }

    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    button.secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--text-muted);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Previews */
    .previews {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }

    @media (max-width: 700px) {
      .previews {
        grid-template-columns: 1fr;
      }
    }

    .preview-box {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .preview-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
    }

    textarea {
      width: 100%;
      height: 280px;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
      color: #e2e8f0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.5;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Text Modifier Web App</h1>
      <p class="subtitle">Upload a text file to automatically insert <strong>"Tesla"</strong> directly above every <strong>"Car"</strong></p>
    </header>

    <div class="card">
      <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
        <svg viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p>Drag & drop your <code>.txt</code> file here, or <span>browse</span></p>
        <input type="file" id="fileInput" accept=".txt,text/plain">
      </div>

      <div class="controls">
        <label class="checkbox-label">
          <input type="checkbox" id="caseInsensitive" checked>
          Match case-insensitively ("Car", "car", "CAR")
        </label>
        
        <div class="btn-group">
          <button id="processBtn" disabled>Process File</button>
          <button class="secondary" id="downloadBtn" disabled>Download Modified File</button>
        </div>
      </div>
    </div>

    <div class="card previews">
      <div class="preview-box">
        <div class="preview-title">Original Text <span id="originalCount" class="badge" style="display:none;"></span></div>
        <textarea id="originalText" placeholder="Original content will appear here..." readonly></textarea>
      </div>
      <div class="preview-box">
        <div class="preview-title">Modified Text <span id="modifiedCount" class="badge" style="display:none;"></span></div>
        <textarea id="modifiedText" placeholder="Modified content with 'Tesla' inserted above 'Car' will appear here..."></textarea>
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const dropzone = document.getElementById('dropzone');
    const originalText = document.getElementById('originalText');
    const modifiedText = document.getElementById('modifiedText');
    const processBtn = document.getElementById('processBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const caseInsensitiveCheckbox = document.getElementById('caseInsensitive');
    const originalCount = document.getElementById('originalCount');
    const modifiedCount = document.getElementById('modifiedCount');

    let originalFileName = "modified.txt";

    // Drag & Drop handlers
    ['dragenter', 'dragover'].forEach(eventName => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
      });
    });

    dropzone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        handleFile(files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

    function handleFile(file) {
      originalFileName = file.name;
      const reader = new FileReader();
      reader.onload = (e) => {
        originalText.value = e.target.result;
        processBtn.disabled = false;
        transformText();
      };
      reader.readAsText(file);
    }

    function transformText() {
      const text = originalText.value;
      if (!text) return;

      const caseInsensitive = caseInsensitiveCheckbox.checked;
      const lines = text.split(/\r?\n/);
      const resultLines = [];
      let insertions = 0;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const matches = caseInsensitive 
          ? line.trim().toLowerCase() === "car" 
          : line.trim() === "Car";

        if (matches) {
          resultLines.push("Tesla");
          insertions++;
        }
        resultLines.push(line);
      }

      modifiedText.value = resultLines.join("\n");
      downloadBtn.disabled = false;

      // Update badges
      originalCount.textContent = `${lines.length} lines`;
      originalCount.style.display = "inline-block";
      modifiedCount.textContent = `+${insertions} Tesla added`;
      modifiedCount.style.display = "inline-block";
    }

    processBtn.addEventListener('click', transformText);
    caseInsensitiveCheckbox.addEventListener('change', transformText);

    downloadBtn.addEventListener('click', () => {
      const blob = new Blob([modifiedText.value], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const baseName = originalFileName.replace(/\.[^/.]+$/, "");
      a.download = `${baseName}_with_tesla.txt`;
      a.href = url;
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
